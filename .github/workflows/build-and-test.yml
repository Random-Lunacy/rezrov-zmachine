name: Build and run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vitest 5 requires Node ^22.12 || ^24 || >=26, so Node 20 (EOL) is no
        # longer supported. Keep this in sync with "engines" in package.json.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Without this the cache key hashes only the root lockfile, so the
          # example installs below would miss the cache on every run and the key
          # would never invalidate when an example lockfile changes.
          cache-dependency-path: |
            package-lock.json
            examples/console/package-lock.json
            examples/blessedConsole/package-lock.json
            examples/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Install example dependencies
        # tests/examples/ exercises the console examples against the versions
        # they actually declare (chalk 6, nopt 10) rather than whatever the root
        # tree happens to hoist. --ignore-scripts because each example links the
        # repo root via "file:../..", and a lifecycle script there would run
        # against the link rather than a normal install.
        run: |
          npm ci --ignore-scripts --prefix examples/console
          npm ci --ignore-scripts --prefix examples/blessedConsole
      - name: Build web example
        # A real browser bundle is the only check that the main entry needs no
        # Node shims: a stray node: import resolves to Vite's browser-external
        # stub and only fails at runtime, so fail the build if one shows up.
        run: |
          npm ci --ignore-scripts --prefix examples/web
          npm run build --prefix examples/web
          ! grep -rl "__vite-browser-external" examples/web/dist
      - name: Run tests with coverage
        run: npm run test:coverage
