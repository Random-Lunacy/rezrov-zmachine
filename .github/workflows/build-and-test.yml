name: Build and run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level so the scan step's `if` can test whether the token is actually
    # present (the `secrets` context is not readable from a step-level `if`).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        # Vitest 5 requires Node ^22.12 || ^24 || >=26, so Node 20 (EOL) is no
        # longer supported. Keep this in sync with "engines" in package.json.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Without this the cache key hashes only the root lockfile, so the
          # example installs below would miss the cache on every run and the key
          # would never invalidate when an example lockfile changes.
          cache-dependency-path: |
            package-lock.json
            examples/console/package-lock.json
            examples/blessedConsole/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install example dependencies
        # tests/examples/ exercises the console examples against the versions
        # they actually declare (chalk 6, nopt 10) rather than whatever the root
        # tree happens to hoist. --ignore-scripts because each example now links
        # the repo root via "file:../..", and npm would otherwise re-run the
        # root's postinstall (patch-package) against the link.
        run: |
          npm ci --ignore-scripts --prefix examples/console
          npm ci --ignore-scripts --prefix examples/blessedConsole
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: SonarQube Scan
        # Only on 22.x, and only when the token is available. Dependabot and
        # fork pull requests do not receive repository secrets, so the scanner
        # would fail with HTTP 403 on an empty token and block an otherwise
        # green PR.
        if: matrix.node-version == '22.x' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
