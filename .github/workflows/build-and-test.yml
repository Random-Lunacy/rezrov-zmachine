name: Build and run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    # Job-level so the scan step's `if` can test whether the token is actually
    # present (the `secrets` context is not readable from a step-level `if`).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    strategy:
      matrix:
        # Vitest 5 requires Node ^22.12 || ^24 || >=26, so Node 20 (EOL) is no
        # longer supported. Keep this in sync with "engines" in package.json.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: SonarQube Scan
        # Only on 22.x, and only when the token is available. Dependabot and
        # fork pull requests do not receive repository secrets, so the scanner
        # would fail with HTTP 403 on an empty token and block an otherwise
        # green PR.
        if: matrix.node-version == '22.x' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
