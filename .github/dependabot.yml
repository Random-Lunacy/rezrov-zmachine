version: 2
updates:
  # GitHub Actions — keep CI dependencies current
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - 'actions/*'

  # Root package — core library and all dev tooling
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 10
    versioning-strategy: auto
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'
      build-tools:
        patterns:
          - 'typescript'
          - 'tsc-esm-fix'
          - 'tsx'
          - 'ts-node'
          - 'vite'
      types:
        patterns:
          - '@types/*'

  # Console example
  - package-ecosystem: 'npm'
    directory: '/examples/console'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: auto
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      types:
        patterns:
          - '@types/*'

  # Blessed console example
  - package-ecosystem: 'npm'
    directory: '/examples/blessedConsole'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: auto
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      types:
        patterns:
          - '@types/*'

  # Web example (V6 graphics)
  - package-ecosystem: 'npm'
    directory: '/examples/web'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: auto
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
