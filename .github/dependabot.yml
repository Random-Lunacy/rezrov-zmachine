version: 2
updates:
  # GitHub Actions — keep CI dependencies current
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'

  # Root package — production dependencies (published library surface).
  # 'widen' relaxes the package.json range instead of bumping the floor, so
  # consumers installing this library aren't forced onto a newer minimum
  # than they need.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 5
    versioning-strategy: widen
    allow:
      - dependency-type: 'production'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # Root package — dev tooling (build/lint/test). 'increase' just bumps
  # straight to latest since this tooling is never consumed downstream.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    allow:
      - dependency-type: 'development'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'
      build-tools:
        patterns:
          - 'typescript'
          - 'tsc-esm-fix'
          - 'tsx'
          - 'ts-node'
      types:
        patterns:
          - '@types/*'

  # Console example
  - package-ecosystem: 'npm'
    directory: '/examples/console'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      types:
        patterns:
          - '@types/*'

  # Blessed console example
  - package-ecosystem: 'npm'
    directory: '/examples/blessedConsole'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      types:
        patterns:
          - '@types/*'

  # Web example (V6 graphics)
  - package-ecosystem: 'npm'
    directory: '/examples/web'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'npm'
      - 'examples'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      types:
        patterns:
          - '@types/*'
